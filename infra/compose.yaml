name: imobiliaria

services:
  postgres:
    image: postgres:18
    container_name: imobiliaria-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      IMOB_APP_PASSWORD: ${IMOB_APP_PASSWORD}
      IMOB_PROVISIONER_PASSWORD: ${IMOB_PROVISIONER_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
