name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancela execuções anteriores da mesma branch quando um novo push chega
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build e testes
        run: ./mvnw -B verify

      - name: Especificação OpenAPI atualizada
        run: git diff --exit-code ../docs/api/openapi.yaml

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Tipos da API atualizados
        run: |
          npm run gerar:api
          git diff --exit-code src/compartilhado/api/esquema.d.ts

      - name: Lint
        run: npm run lint

      - name: Checagem de tipos e build
        run: npm run build

    logging:
      pattern:
        level: "%5p [req=%X{requisicao:-} tenant=%X{tenant:-} usuario=%X{usuario:-}]"
